global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # FastAPI app: prometheus_client ASGI app mounted at /metrics (trailing slash avoids a redirect).
  - job_name: docflow-api
    metrics_path: /metrics/
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api

  # Extraction worker (`docflow worker --serve` -> prometheus_client.start_http_server(9100)).
  - job_name: docflow-worker
    static_configs:
      - targets: ["worker:9100"]
        labels:
          service: worker

  # Span-derived metrics (spanmetrics connector -> prometheus exporter).
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          service: otel-collector

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
