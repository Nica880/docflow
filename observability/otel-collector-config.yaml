# OpenTelemetry Collector (contrib): receives OTLP/HTTP traces from the API, workers, CLI and
# Airflow tasks; derives RED metrics from spans (spanmetrics connector) for Prometheus.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s

connectors:
  spanmetrics:
    namespace: docflow.spans
    histogram:
      explicit:
        buckets: [10ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s, 10s, 30s, 60s, 300s]

exporters:
  debug:
    verbosity: basic
  prometheus:
    endpoint: 0.0.0.0:8889

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, spanmetrics]
    metrics:
      receivers: [spanmetrics]
      exporters: [prometheus]
