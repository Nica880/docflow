name: docflow
version: "1.0.0"
config-version: 2
profile: docflow

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  docflow:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

tests:
  docflow:
    +store_failures: false
